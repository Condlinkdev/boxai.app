<style>
:root{--night:#0b2229;--mint:#8bebcf;--paper:#f3f5ef;--muted:#a3b6b8;--ink:#0c252e}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:40px 24px;background:var(--night);color:#fff;font-family:'Atkinson Hyperlegible',sans-serif;background-image:radial-gradient(ellipse at 50% 20%,#18434a66,transparent 60%)}
main{max-width:560px;text-align:center}
img{width:170px;height:auto;display:block;margin:0 auto 34px}
.eyebrow{font:500 12px 'Archivo',sans-serif;letter-spacing:1.6px;color:var(--muted);margin:0}
h1{font-family:'Archivo',sans-serif;font-size:clamp(32px,7vw,48px);font-weight:500;line-height:1.08;letter-spacing:-2px;margin:18px 0 16px}
p.texto{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 32px}
a.botao{display:inline-block;padding:15px 24px;border-radius:35px;background:var(--mint);color:var(--ink);font:500 14px 'Archivo',sans-serif;text-decoration:none}
a.botao:focus-visible{outline:2px solid #fff;outline-offset:4px}
ul{list-style:none;padding:0;margin:34px 0 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
ul a{color:var(--muted);text-decoration:none;font-size:14px;border:1px solid #ffffff2b;border-radius:20px;padding:8px 14px}
ul a:hover,ul a:focus-visible{color:var(--mint);border-color:var(--mint)}
</style>
</head>
<body>
